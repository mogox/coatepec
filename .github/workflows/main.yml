name: Ruby

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby 3.4 / Rails 8.1 (primary)
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # `bundler-cache: true` above only installs the repo root Gemfile.lock;
      # the fixture Rails app under spec/fixtures has its own Gemfile/lockfile
      # that integration specs spawn subprocesses against (via BUNDLE_GEMFILE),
      # so it needs its own bundle install.
      - name: Install fixture app dependencies
        run: bundle install
        working-directory: spec/fixtures/rails_app
      - run: bundle exec rake

  compat_rails_7_1:
    runs-on: ubuntu-latest
    name: Ruby 3.2 / Rails 7.1 (compat)
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install fixture app dependencies
        run: bundle install
        working-directory: spec/fixtures/rails_app_7_1
      - run: bundle exec rspec spec/unit spec/integration
        env:
          COATEPEC_FIXTURE_APP: rails_app_7_1
